name: claude-review-refs

# Fails when the workflows pin different releases of Quartel-Enterprise/claude-review, so a bump
# that misses one `uses:` doesn't leave the review on request behaving unlike the opening review.
on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Check that every claude-review ref is the same
        run: |
          refs=$(grep -rhoE 'Quartel-Enterprise/claude-review/[a-z-]+@[^[:space:]]+' .github/workflows | sed 's/.*@//' | sort -u)
          if [ "$(grep -c . <<< "$refs")" -gt 1 ]; then
            echo "::error::The workflows pin different releases of Quartel-Enterprise/claude-review: $(tr '\n' ' ' <<< "$refs")Bump every uses: to the same one."
            grep -rnE 'Quartel-Enterprise/claude-review/[a-z-]+@' .github/workflows
            exit 1
          fi
          echo "Every claude-review ref is ${refs:-absent}."
