name: legal

# Fails when a legal page isn't what its Markdown gives, or the Markdown has something the apps can't draw: see
# scripts/build-legal.mjs and docs/legal.md. Run it locally with npm run check:legal.
on:
  pull_request:
    paths:
      - '.github/workflows/legal.yml'
      - 'scripts/build-legal.mjs'
      - 'public/legal/**'
      - 'public/privacy.html'
      - 'public/terms.html'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legal.yml'
      - 'scripts/build-legal.mjs'
      - 'public/legal/**'
      - 'public/privacy.html'
      - 'public/terms.html'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No dependencies to install: the check is plain Node.
      - name: Check the legal pages
        run: node scripts/build-legal.mjs --check
