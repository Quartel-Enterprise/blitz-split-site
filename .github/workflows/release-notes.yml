name: release-notes

# Fails when a version's file has something the apps can't read, or a language's notes aren't English's: see
# scripts/build-release-notes.mjs and docs/release-notes.md. Run it locally with npm run check:release-notes.
on:
  pull_request:
    paths:
      - '.github/workflows/release-notes.yml'
      - 'scripts/build-release-notes.mjs'
      - 'scripts/lib/**'
      - 'release-notes/**'
      - 'pages/release-notes.html'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-notes.yml'
      - 'scripts/build-release-notes.mjs'
      - 'scripts/lib/**'
      - 'release-notes/**'
      - 'pages/release-notes.html'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No dependencies to install: the check is plain Node.
      - name: Check the release notes
        run: node scripts/build-release-notes.mjs --check
