name: Feature request
description: An idea to make blitzsplit.com better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the existing issues first, in case someone asked for it already. An idea
        for the apps goes to [blitz-split-client](https://github.com/Quartel-Enterprise/blitz-split-client/issues/new/choose).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do on the site, and what gets in the way today?
      placeholder: When I send the site to a friend, they can't tell...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How would you like the site to help? Sketches and examples from other sites are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
