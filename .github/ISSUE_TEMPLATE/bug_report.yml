name: Bug report
description: Something on blitzsplit.com doesn't work or read as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please search the existing issues first. This is only the site:
        something in the apps goes to [blitz-split-client](https://github.com/Quartel-Enterprise/blitz-split-client/issues/new/choose).
        Never report a security problem here: see the [security policy](https://github.com/Quartel-Enterprise/blitz-split-site/blob/main/SECURITY.md).
  - type: dropdown
    id: page
    attributes:
      label: Page
      multiple: true
      options:
        - Landing
        - Privacy policy
        - Terms of use
        - What's new (release notes)
        - An invite link's preview
        - Another one
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Address
      description: The link you were on. For an invite link, leave out the group's code.
      placeholder: https://blitzsplit.com/privacy?lang=fr
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 26 on an iPhone 17 / Chrome 142 on Windows 11
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language and theme
      placeholder: French, dark
  - type: input
    id: assistive-technology
    attributes:
      label: Assistive technology or accessibility settings
      description: For an accessibility barrier, what you use. Leave it empty otherwise.
      placeholder: VoiceOver, NVDA, 200% zoom, reduced motion, keyboard only...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open blitzsplit.com
        2. Pick Japanese in the language menu
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a translation, the text you would write instead.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots or a screen recording help a lot.
    validations:
      required: true
