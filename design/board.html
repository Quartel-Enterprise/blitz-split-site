<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site design board</title>
  <!-- Not deployed (outside public/): every page of the site at the screen sizes it must hold, light and dark side by
       side. Run `npm run dev` first; the frames load http://localhost:8787. -->
  <style>
    :root { color-scheme: light; --bg: #f4f4f5; --fg: #09090b; --muted: #71717a; --card: #ffffff; --border: #e4e4e7; --primary: #266489; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b; --border: #27272a; --primary: #95cdf7; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 16px; }
    .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--bg); }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--border); }
    main { padding: 24px; display: grid; gap: 40px; }
    .row h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    .row h2 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
    .pair { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .frame { overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px var(--border), 0 12px 32px -12px rgba(0,0,0,.25); background: var(--card); }
    .frame iframe { border: 0; transform-origin: 0 0; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Blitz Split site</h1>
    <span class="seg" id="page">
      <button data-v="/" aria-pressed="true">Landing</button>
      <button data-v="/privacy">Privacy policy</button>
      <button data-v="/terms">Terms of use</button>
      <button data-v="/g/AbCd1234">Invite link</button>
    </span>
    <span class="seg" id="lang">
      <button data-v="pt" aria-pressed="true">Português</button>
      <button data-v="en">English</button>
      <button data-v="es">Español</button>
      <button data-v="fr">Français</button>
    </span>
    <span class="seg" id="platform">
      <button data-v="android">Android</button>
      <button data-v="ios">iPhone</button>
      <button data-v="mac">Mac</button>
      <button data-v="desktop" aria-pressed="true">Other computer</button>
    </span>
  </header>
  <main id="rows"></main>
  <script>
    const ORIGIN = "http://localhost:8787";
    const SIZES = [
      { name: "Phone", w: 390, h: 844, note: "iPhone, compact Android" },
      { name: "Phone, landscape", w: 844, h: 390, note: "" },
      { name: "Small phone", w: 360, h: 740, note: "the narrowest common width" },
      { name: "Tablet, portrait", w: 820, h: 1180, note: "iPad, foldable open" },
      { name: "Tablet, landscape", w: 1180, h: 820, note: "" },
      { name: "Laptop", w: 1280, h: 800, note: "Mac default window" },
      { name: "Desktop", w: 1440, h: 900, note: "" },
      { name: "Wide desktop", w: 1920, h: 1080, note: "" },
    ];
    const state = { page: "/", lang: "pt", platform: "desktop" };
    function render() {
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      for (const s of SIZES) {
        const scale = Math.min(1, 620 / s.w, 640 / s.h);
        const row = document.createElement("section");
        row.className = "row";
        row.innerHTML = `<h2>${s.name} · ${s.w}×${s.h}<small>${s.note}${s.note ? " · " : ""}${Math.round(scale * 100)}%</small></h2><div class="pair"></div>`;
        for (const theme of ["light", "dark"]) {
          const fig = document.createElement("figure");
          const url = `${ORIGIN}${state.page}?theme=${theme}&lang=${state.lang}&platform=${state.platform}`;
          fig.innerHTML = `<figcaption>${theme === "light" ? "Light" : "Dark"}</figcaption>
            <div class="frame" style="width:${s.w * scale}px;height:${s.h * scale}px">
              <iframe loading="lazy" src="${url}" width="${s.w}" height="${s.h}" style="transform:scale(${scale})" title="${s.name} ${theme}"></iframe>
            </div>`;
          row.querySelector(".pair").append(fig);
        }
        rows.append(row);
      }
    }
    for (const id of ["page", "lang", "platform"]) {
      document.getElementById(id).addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        state[id] = b.dataset.v;
        document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        render();
      });
    }
    render();
  </script>
</body>
</html>
